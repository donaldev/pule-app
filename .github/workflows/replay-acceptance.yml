name: Replay acceptance test

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      operation:
        description: Manual acceptance operation (process-one claims the next eligible queued recording)
        type: choice
        required: true
        default: check
        options:
          - check
          - process-one
          - cleanup-only

permissions:
  contents: read

jobs:
  acceptance:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.operation != 'cleanup-only')
    concurrency:
      group: replay-acceptance-worker
      # A later tick must never interrupt an active recording. SQL leases also fence publication.
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment: replay-acceptance
    # Includes setup and a long-running recording; remains below the 40-minute SQL lease.
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: replay-worker/requirements.txt
      - name: Prepare existing worker
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg libglib2.0-0 libgl1
          fi
          python -m pip install --disable-pip-version-check -r replay-worker/requirements.txt
          python replay-worker/replay_worker.py --check
      - name: Verify worker credentials without claiming work
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_RECORDINGS_BUCKET: pule-frame-recordings
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import json, os, sys, shutil, tempfile
          sys.path.insert(0, 'replay-worker')
          from replay_worker import SupabaseAPI
          from r2_source import R2Source, BUCKET
          if os.environ.get('SUPABASE_URL') != 'https://pgljdmevusgvvlplaedt.supabase.co' or not os.environ.get('SUPABASE_SERVICE_ROLE_KEY'):
              raise SystemExit('Acceptance worker secrets are missing or target the wrong project.')
          # Read bucket metadata only; service_role intentionally has no direct app-table SELECT.
          try:
              scratch = shutil.disk_usage(tempfile.gettempdir()).free
              memory = {line.split(':')[0]: int(line.split()[1]) * 1024 for line in open('/proc/meminfo')}
              if scratch < 8 * 1024**3 or memory['MemAvailable'] < 4 * 1024**3 or (os.cpu_count() or 0) < 2:
                  raise ValueError('Insufficient recording runner capacity')
              print(json.dumps({'runner_cpu': os.cpu_count(), 'scratch_free_gib': round(scratch / 1024**3, 1), 'memory_available_gib': round(memory['MemAvailable'] / 1024**3, 1)}))
              R2Source().client.head_bucket(Bucket=BUCKET)
              api = SupabaseAPI(os.environ['SUPABASE_URL'], os.environ['SUPABASE_SERVICE_ROLE_KEY'])
              conn, response = api._request('GET', '/storage/v1/bucket/frame-replays')
              try:
                  bucket = json.loads(response.read())
                  if bucket.get('id') != 'frame-replays' or bucket.get('public') is not False:
                      raise ValueError('Unexpected backend result')
              finally:
                  conn.close()
          except Exception:
              raise SystemExit('Acceptance credential verification failed; no recording was claimed.') from None
          print('Supabase/R2 credentials and at least 8 GiB scratch verified; no recording claimed.')
          PY
      - name: Process one queued recording
        # One job per tick. The existing SQL lease remains authoritative across devices/workers.
        if: github.event_name == 'schedule' || inputs.operation == 'process-one'
        timeout-minutes: 35
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_RECORDINGS_BUCKET: pule-frame-recordings
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python replay-worker/replay_worker.py

  cleanup:
    # Independent of long-running processing, so cleanup keeps its five-minute cadence.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || inputs.operation == 'process-one' || inputs.operation == 'cleanup-only')
    runs-on: ubuntu-24.04
    environment: replay-acceptance
    timeout-minutes: 5
    concurrency:
      group: replay-cleanup-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install existing cleanup dependencies
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Run one bounded cleanup pass
        timeout-minutes: 3
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_RECORDINGS_BUCKET: pule-frame-recordings
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/storage/cleanup-frame-replays.mjs
